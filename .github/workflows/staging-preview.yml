name: Staging Preview Validation

on:
  pull_request:
    branches: [staging0217]
    types: [opened, synchronize, reopened]
  push:
    branches: [staging0217]

permissions:
  contents: read
  pull-requests: write

env:
  STAGING_PREVIEW_URL: https://cubiqo-repo-git-staging0217-cubiqo-projects.vercel.app

jobs:
  validate:
    name: Validate for Staging Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Run build
        run: npm run build

      - name: Run unit tests
        run: npm run test:run
        env:
          NODE_ENV: test

      - name: Post validation status
        if: github.event_name == 'pull_request'
        run: |
          echo "## Staging Preview Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build and tests passed for staging0217 preview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Preview URL:** ${{ env.STAGING_PREVIEW_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Once verified on staging, approve and merge to \`main\` for production." >> $GITHUB_STEP_SUMMARY

  staging-ready:
    name: Staging Ready Check
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging0217'

    steps:
      - name: Report staging deployment status
        run: |
          echo "## Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Changes validated and deployed to staging0217" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Preview URL:** ${{ env.STAGING_PREVIEW_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Verify the preview deployment at the URL above" >> $GITHUB_STEP_SUMMARY
          echo "2. Open a PR from \`staging0217\` → \`main\` to promote to production" >> $GITHUB_STEP_SUMMARY
          echo "3. Upon approval and merge, changes will deploy to cubiqo.ai" >> $GITHUB_STEP_SUMMARY
