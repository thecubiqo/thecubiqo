name: Activity Monitor

# Monitor all activity across staging, main, PRs, and Vercel deployments
on:
  push:
    branches:
      - main
      - staging
  pull_request:
    types: [opened, closed, reopened, synchronize, ready_for_review]
    branches:
      - main
      - staging
  deployment_status:
  workflow_dispatch:
  schedule:
    # Run every 6 hours to monitor general health
    - cron: '0 */6 * * *'

jobs:
  # Track branch activity
  branch-activity:
    name: Monitor Branch Activity
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
      
      - name: Analyze Commit Activity
        id: commit-analysis
        run: |
          echo "## Branch Activity Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** Push" >> $GITHUB_STEP_SUMMARY
          echo "**Commit SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Pusher:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get commit details
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          FILES_CHANGED=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | wc -l)
          
          echo "**Commit Message:** $COMMIT_MSG" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** $COMMIT_AUTHOR" >> $GITHUB_STEP_SUMMARY
          echo "**Files Changed:** $FILES_CHANGED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # List changed files
          echo "### Changed Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          git diff-tree --no-commit-id --name-only -r ${{ github.sha }} >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      
      - name: Send Activity Notification
        run: |
          # Send to monitoring API endpoint
          curl -X POST ${{ secrets.APP_URL }}/api/monitoring/activity \
            -H "Authorization: Bearer ${{ secrets.MONITORING_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "branch_push",
              "branch": "${{ github.ref_name }}",
              "sha": "${{ github.sha }}",
              "actor": "${{ github.actor }}",
              "timestamp": "'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'",
              "repository": "${{ github.repository }}"
            }' || echo "Monitoring endpoint not configured"

  # Monitor PR activity
  pr-activity:
    name: Monitor PR Activity
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Analyze PR Activity
        run: |
          echo "## PR Activity Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR #${{ github.event.pull_request.number }}:** ${{ github.event.pull_request.title }}" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** ${{ github.event.action }}" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** @${{ github.event.pull_request.user.login }}" >> $GITHUB_STEP_SUMMARY
          echo "**Base:** ${{ github.event.pull_request.base.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**Head:** ${{ github.event.pull_request.head.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**Draft:** ${{ github.event.pull_request.draft }}" >> $GITHUB_STEP_SUMMARY
          echo "**Mergeable:** ${{ github.event.pull_request.mergeable }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ github.event.pull_request.html_url }}" >> $GITHUB_STEP_SUMMARY
      
      - name: Check PR Status
        if: github.event.action == 'synchronize' || github.event.action == 'opened'
        run: |
          echo "### PR Status Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Changed files: ${{ github.event.pull_request.changed_files }}" >> $GITHUB_STEP_SUMMARY
          echo "- Additions: +${{ github.event.pull_request.additions }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deletions: -${{ github.event.pull_request.deletions }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commits: ${{ github.event.pull_request.commits }}" >> $GITHUB_STEP_SUMMARY
      
      - name: Send PR Activity Notification
        run: |
          MERGED="false"
          if [ "${{ github.event.action }}" == "closed" ] && [ "${{ github.event.pull_request.merged }}" == "true" ]; then
            MERGED="true"
          fi
          
          curl -X POST ${{ secrets.APP_URL }}/api/monitoring/activity \
            -H "Authorization: Bearer ${{ secrets.MONITORING_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "pr_activity",
              "pr_number": ${{ github.event.pull_request.number }},
              "action": "${{ github.event.action }}",
              "title": "${{ github.event.pull_request.title }}",
              "author": "${{ github.event.pull_request.user.login }}",
              "base": "${{ github.event.pull_request.base.ref }}",
              "head": "${{ github.event.pull_request.head.ref }}",
              "draft": ${{ github.event.pull_request.draft }},
              "merged": '"$MERGED"',
              "timestamp": "'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'",
              "url": "${{ github.event.pull_request.html_url }}",
              "repository": "${{ github.repository }}"
            }' || echo "Monitoring endpoint not configured"

  # Monitor deployment status
  deployment-status:
    name: Monitor Deployment Status
    runs-on: ubuntu-latest
    if: github.event_name == 'deployment_status'
    
    steps:
      - name: Analyze Deployment
        run: |
          echo "## Deployment Status Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.deployment.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**State:** ${{ github.event.deployment_status.state }}" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** ${{ github.event.deployment.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**SHA:** ${{ github.event.deployment.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ github.event.deployment_status.target_url }}" ]; then
            echo "**Deployment URL:** ${{ github.event.deployment_status.target_url }}" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Send Deployment Notification
        run: |
          curl -X POST ${{ secrets.APP_URL }}/api/monitoring/activity \
            -H "Authorization: Bearer ${{ secrets.MONITORING_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "deployment",
              "environment": "${{ github.event.deployment.environment }}",
              "state": "${{ github.event.deployment_status.state }}",
              "ref": "${{ github.event.deployment.ref }}",
              "sha": "${{ github.event.deployment.sha }}",
              "target_url": "${{ github.event.deployment_status.target_url }}",
              "timestamp": "'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'",
              "repository": "${{ github.repository }}"
            }' || echo "Monitoring endpoint not configured"

  # Periodic health check
  health-check:
    name: Periodic Health Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Check Branch Status
        run: |
          echo "## Periodic Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check main branch
          MAIN_SHA=$(git rev-parse origin/main 2>/dev/null || echo "unknown")
          MAIN_DATE=$(git log origin/main -1 --format=%ci 2>/dev/null || echo "unknown")
          
          echo "### Main Branch" >> $GITHUB_STEP_SUMMARY
          echo "- Latest SHA: \`$MAIN_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "- Last updated: $MAIN_DATE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check staging branch
          STAGING_SHA=$(git rev-parse origin/staging 2>/dev/null || echo "unknown")
          STAGING_DATE=$(git log origin/staging -1 --format=%ci 2>/dev/null || echo "unknown")
          
          echo "### Staging Branch" >> $GITHUB_STEP_SUMMARY
          echo "- Latest SHA: \`$STAGING_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "- Last updated: $STAGING_DATE" >> $GITHUB_STEP_SUMMARY
      
      - name: Check Open PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Open PRs" >> $GITHUB_STEP_SUMMARY
          
          # Get open PRs count
          PR_COUNT=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=open" | \
            jq length)
          
          echo "- Total open PRs: $PR_COUNT" >> $GITHUB_STEP_SUMMARY
          
          # List recent open PRs
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=open&per_page=5" | \
            jq -r '.[] | "- #\(.number): \(.title) (@\(.user.login))"' >> $GITHUB_STEP_SUMMARY || true
      
      - name: Check Application Health
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Application Health" >> $GITHUB_STEP_SUMMARY
          
          # Check production health endpoint
          if [ -n "${{ secrets.APP_URL }}" ]; then
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_URL }}/api/health" || echo "000")
            
            if [ "$HEALTH_STATUS" == "200" ]; then
              echo "✅ Production health endpoint: OK (HTTP $HEALTH_STATUS)" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Production health endpoint: FAIL (HTTP $HEALTH_STATUS)" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ APP_URL not configured" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Send Health Report
        run: |
          curl -X POST ${{ secrets.APP_URL }}/api/monitoring/activity \
            -H "Authorization: Bearer ${{ secrets.MONITORING_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "health_check",
              "timestamp": "'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'",
              "repository": "${{ github.repository }}"
            }' || echo "Monitoring endpoint not configured"
