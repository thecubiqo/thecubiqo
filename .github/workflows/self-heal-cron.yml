name: Daily Self-Heal Job

on:
  schedule:
    # Runs at 10:00 UTC daily (adjust for your timezone)
    # 10:00 UTC = 5:00 AM EST / 2:00 AM PST
    - cron: '0 10 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  self-heal:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Self-Heal Job
        id: trigger
        run: |
          echo "Triggering self-heal job..."
          MAX_RETRIES=3
          ATTEMPT=0
          SUCCESS=false

          while [ $ATTEMPT -lt $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT of $MAX_RETRIES..."

            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "${{ secrets.APP_URL }}/api/cron/self-heal" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              --max-time 300)

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            echo "Response Code: $HTTP_CODE"
            echo "Response Body: $BODY"

            if [ "$HTTP_CODE" -eq 200 ]; then
              SUCCESS=true
              echo "self_heal_status=success" >> "$GITHUB_OUTPUT"
              echo "$BODY" > /tmp/self-heal-result.json
              break
            fi

            if [ $ATTEMPT -lt $MAX_RETRIES ]; then
              WAIT=$((ATTEMPT * 30))
              echo "Retrying in ${WAIT}s..."
              sleep $WAIT
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "self_heal_status=failed" >> "$GITHUB_OUTPUT"
            echo "Self-heal job failed after $MAX_RETRIES attempts"
            echo "$BODY" > /tmp/self-heal-result.json
            exit 1
          fi

          echo "Self-heal job completed successfully"

      - name: Upload Self-Heal Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-heal-result-${{ github.run_number }}
          path: /tmp/self-heal-result.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Report Status
        if: always()
        run: |
          STATUS="${{ steps.trigger.outputs.self_heal_status }}"
          if [ "$STATUS" = "success" ]; then
            echo "✅ Self-heal job executed successfully"
          else
            echo "❌ Self-heal job failed after retries"
          fi
