name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # Build and test job
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [20]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
        continue-on-error: true
      
      - name: Run build
        run: npm run build
      
      - name: Run unit tests
        run: npm run test:run
        env:
          NODE_ENV: test
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: |
            coverage/
            test-results/
          retention-days: 30
      
      - name: Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Check for vulnerabilities
        run: npm audit --json > audit-report.json || true
        
      - name: Upload security audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: audit-report.json
          retention-days: 90
  
  # PR merge audit job
  audit-pr-merges:
    name: Audit PR Merges
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run PR merge audit
        run: npx tsx scripts/audit-pr-merges.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_OWNER: ${{ github.repository_owner }}
          AUDIT_REPO: ${{ github.event.repository.name }}
        continue-on-error: true
      
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-merge-audit-report
          path: REPORTS/PR_MERGE_AUDIT.md
          retention-days: 90
      
      - name: Comment audit summary on commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -f REPORTS/PR_MERGE_AUDIT.md ]; then
            echo "Audit report generated successfully"
            head -50 REPORTS/PR_MERGE_AUDIT.md
          else
            echo "Audit report not found"
          fi
