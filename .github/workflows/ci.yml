name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build and test job
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [20]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
        continue-on-error: true
      
      - name: Run build
        run: npm run build
      
      - name: Run unit tests with coverage
        run: npm run test:run -- --coverage
        env:
          NODE_ENV: test
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: |
            coverage/
            test-results/
          retention-days: 30
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true
      
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        run: |
          echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            echo "Coverage summary generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage data available" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true
  
  # PR merge audit job
  audit-pr-merges:
    name: Audit PR Merges
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run PR merge audit
        run: npx tsx scripts/audit-pr-merges.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_OWNER: ${{ github.repository_owner }}
          AUDIT_REPO: ${{ github.event.repository.name }}
        continue-on-error: true
      
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-merge-audit-report
          path: REPORTS/PR_MERGE_AUDIT.md
          retention-days: 90
      
      - name: Comment audit summary on commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -f REPORTS/PR_MERGE_AUDIT.md ]; then
            echo "Audit report generated successfully"
            head -50 REPORTS/PR_MERGE_AUDIT.md
          else
            echo "Audit report not found"
          fi

  # Staging validation job — API and database checks for staging merges
  staging-api-db-checks:
    name: Staging API & Database Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >
      github.base_ref == 'staging' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/staging')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate API routes
        run: npx vitest run tests/api-routes.test.ts
        env:
          NODE_ENV: test

      - name: Validate database schema & migrations
        run: npx vitest run tests/database-schema.test.ts
        env:
          NODE_ENV: test

      - name: Validate health endpoint module
        run: npx vitest run tests/integration/health-endpoint.test.ts
        env:
          NODE_ENV: test
