name: Staging Readiness Report

on:
  # Manual trigger
  workflow_dispatch:
  # Run every 30 minutes during business hours (UTC)
  schedule:
    - cron: "*/30 8-20 * * 1-5"

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
  statuses: read

jobs:
  staging-readiness:
    name: Check Staging Readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run staging readiness report
        id: readiness
        run: npx tsx scripts/staging-readiness-report.ts
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          READINESS_OWNER: ${{ github.repository_owner }}
          READINESS_REPO: ${{ github.event.repository.name }}

      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-readiness-report
          path: REPORTS/STAGING_READINESS.md
          retention-days: 30

      - name: Print report summary
        if: always()
        run: |
          if [ -f REPORTS/STAGING_READINESS.md ]; then
            echo "### Staging Readiness Report" >> $GITHUB_STEP_SUMMARY
            cat REPORTS/STAGING_READINESS.md >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Report was not generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Report outcome
        if: always()
        run: |
          if [ "${{ steps.readiness.outcome }}" = "success" ]; then
            echo "✅ All agents are done and PRs are staging-ready."
          else
            echo "❌ Not all PRs are staging-ready yet. See the report for details."
          fi
