name: Chromatic Visual Tests

# Trigger on pull requests and pushes to main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  chromatic:
    name: Run Chromatic Visual Tests
    runs-on: ubuntu-latest
    
    # Set explicit permissions for security
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for Chromatic

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          # NOTE: You need to set up the CHROMATIC_PROJECT_TOKEN secret in GitHub:
          # 1. Go to https://www.chromatic.com and create a project
          # 2. Get your project token
          # 3. Add it to GitHub: Settings → Secrets and variables → Actions → New repository secret
          # 4. Name: CHROMATIC_PROJECT_TOKEN
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Only run visual tests when relevant files change (optional optimization)
          onlyChanged: true
          # Don't fail the build on visual changes (let humans review)
          exitZeroOnChanges: true
          # Automatically accept baselines on main branch
          autoAcceptChanges: ${{ github.ref == 'refs/heads/main' }}
