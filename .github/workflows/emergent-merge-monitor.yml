name: Emergent Merge Monitor

on:
  push:
    paths:
      - '.emergent/emergent.yml'
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  # Watch the emergent environment file for changes
  watch-emergent:
    name: Watch Emergent Environment
    runs-on: ubuntu-latest
    permissions: {}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read emergent environment info
        run: |
          if [ -f ".emergent/emergent.yml" ]; then
            echo "📡 Emergent environment file updated"
            echo "---"
            cat .emergent/emergent.yml
            echo "---"
            JOB_ID=$(jq -r '.job_id // "unknown"' .emergent/emergent.yml 2>/dev/null || echo "unknown")
            ENV_IMAGE=$(jq -r '.env_image_name // "unknown"' .emergent/emergent.yml 2>/dev/null || echo "unknown")
            CREATED_AT=$(jq -r '.created_at // "unknown"' .emergent/emergent.yml 2>/dev/null || echo "unknown")
            echo "🔑 Job ID     : $JOB_ID"
            echo "🐳 Env Image  : $ENV_IMAGE"
            echo "🕐 Created At : $CREATED_AT"
            echo "📌 Commit     : ${{ github.sha }}"
            echo "👤 Actor      : ${{ github.actor }}"
            echo "🌿 Branch     : ${GITHUB_REF#refs/heads/}"
          else
            echo "⚠️  .emergent/emergent.yml not found"
          fi

  # Monitor coder (copilot/emergent agent) PR merges
  monitor-coider-merge:
    name: Monitor Coder Merge
    runs-on: ubuntu-latest
    permissions: {}
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true

    steps:
      - name: Report merged PR details
        run: |
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          MERGE_COMMIT="${{ github.event.pull_request.merge_commit_sha }}"

          echo "✅ PR #$PR_NUMBER merged: $PR_TITLE"
          echo "   Branch  : $PR_BRANCH → $BASE_BRANCH"
          echo "   Author  : $PR_AUTHOR"
          echo "   Commit  : $MERGE_COMMIT"

          # Detect if this is a copilot or emergent agent merge
          case "$PR_AUTHOR" in
            Copilot|copilot-swe-agent*|github-actions*)
              echo "🤖 Coder agent merge detected — emergent coding system active"
              ;;
            *)
              echo "👤 Human merge: $PR_AUTHOR"
              ;;
          esac

          case "$PR_BRANCH" in
            copilot/*)
              echo "⚡ Emergent copilot branch merged: $PR_BRANCH"
              ;;
            *)
              echo "📌 Branch merged: $PR_BRANCH"
              ;;
          esac
