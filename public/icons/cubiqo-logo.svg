<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cube-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8C33"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
    <linearGradient id="cq-grad" x1="8" y1="16" x2="56" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F0F0"/>
    </linearGradient>
  </defs>
  <!-- Rounded cube background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#cube-grad)"/>
  <!-- Inner shadow for depth -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
  <!-- CQ monogram — C letter with rounded left corners -->
  <path d="M30 16 H15 C11.1 16 8 19.9 8 23 V41 C8 44.9 11.1 48 15 48 H30 V41 H15 V23 H30 Z" fill="url(#cq-grad)"/>
  <!-- CQ monogram — Q letter with rounded right corners -->
  <path fill-rule="evenodd" d="M34 16 H49 C52.9 16 56 19.9 56 23 V41 C56 44.9 52.9 48 49 48 H34 Z M41 23 H49 V41 H41 Z" fill="url(#cq-grad)"/>
  <!-- CQ monogram — Q tail diagonal -->
  <path d="M46 38 L56 51 L51 51 L43 42 Z" fill="url(#cq-grad)"/>
</svg>
