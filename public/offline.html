<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CubiQo — Offline</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Segoe UI",sans-serif;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
    .wrap{max-width:360px}
    .icon{width:64px;height:64px;margin:0 auto 1.5rem;border-radius:16px;background:linear-gradient(135deg,#ff6f00,#e65100);display:flex;align-items:center;justify-content:center}
    h1{font-size:1.5rem;font-weight:700;margin-bottom:.5rem}
    p{font-size:.875rem;color:rgba(255,255,255,.6);line-height:1.6;margin-bottom:1.5rem}
    button{background:linear-gradient(90deg,#ff6f00,#e65100);border:none;color:#fff;font-size:.875rem;font-weight:600;padding:.75rem 2rem;border-radius:12px;cursor:pointer}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="#fff" stroke-width="2"/><rect x="8" y="8" width="8" height="8" rx="1.5" fill="#fff" fill-opacity=".9"/></svg>
    </div>
    <h1>You're Offline</h1>
    <p>CubiQo needs an internet connection to work. Please check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
