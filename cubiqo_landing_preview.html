<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CubiQo™ | The Home to Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,700;0,800;1,700;1,800&display=swap');

        body {
            background-color: #08080a;
            /* Deep black matching the screenshot */
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        /* 3D Canvas Background */
        #hero-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Faded Structural Grid Lines */
        .grid-lines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
        }

        .line-v {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        .line-h {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        /* Logo Typography Colors */
        .color-cq {
            color: #ff8c00;
        }

        /* Orange */
        .color-ubio {
            color: #d1d5db;
        }

        /* Silver */

        .tagline {
            color: #ff8c00;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.2px;
            margin-top: 4px;
        }

        /* Custom SIGNAL Logo */
        .signal-text {
            font-weight: 800;
            font-style: italic;
            font-size: 26px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* Custom RGY Traffic Light Container */
        .rgy-container {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 10px 8px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            width: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .rgy-light {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin: 6px 0;
            opacity: 0.2;
            transition: all 0.3s ease;
        }

        .rgy-red {
            background-color: #ff3b30;
        }

        /* Active Yellow State */
        .rgy-yellow {
            background-color: #ffcc00;
            opacity: 1;
            box-shadow: 0 0 12px 2px rgba(255, 204, 0, 0.6);
        }

        .rgy-green {
            background-color: #34c759;
        }

        /* UI Layering */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        /* Support Button Match */
        .support-btn {
            background-color: #262738;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border-radius: 9999px;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }

        .support-btn:hover {
            background-color: #2d2e42;
            border-color: rgba(255, 140, 0, 0.4);
            color: #ffffff;
        }

        .support-tail {
            position: absolute;
            bottom: -6px;
            right: 32px;
            width: 14px;
            height: 14px;
            background-color: #262738;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transform: rotate(45deg);
        }
    </style>
</head>

<body>

    <!-- Dynamic 3D Physics Canvas for Lines and Soul -->
    <canvas id="hero-canvas"></canvas>

    <!-- Blueprint Grid Lines -->
    <div class="grid-lines">
        <div class="line-v" style="left: 280px;"></div>
        <div class="line-v" style="right: 280px;"></div>
        <div class="line-h" style="top: 130px;"></div>
        <div class="line-h" style="bottom: 120px;"></div>
    </div>

    <!-- Interface Content -->
    <div class="ui-layer">

        <!-- TOP SECTION -->
        <div class="flex justify-between items-start">

            <!-- Logo area -->
            <div class="p-8 w-[280px] pointer-events-auto pt-10 pl-10">
                <h1 class="text-[44px] tracking-tighter leading-none" style="font-family: 'Inter', sans-serif;">
                    <span class="color-cq font-medium">C</span><span class="color-ubio font-bold">ubi</span><span
                        class="color-cq font-medium">Q</span><span class="color-ubio font-bold">o</span><sup
                        class="text-sm color-ubio font-normal ml-1 relative -top-4">™</sup>
                </h1>
                <p class="tagline">The home to intelligence</p>
            </div>

            <!-- Signal & Indicators area -->
            <div class="p-8 w-[280px] flex flex-col items-end pointer-events-auto">

                <!-- SIGNAL Logo -->
                <div class="flex items-center gap-3 mb-10 mr-4">
                    <!-- Accurate Speech Bubble Icon -->
                    <svg width="45" height="40" viewBox="0 0 100 80" class="drop-shadow-lg">
                        <defs>
                            <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ffb700" />
                                <stop offset="100%" stop-color="#ff5e00" />
                            </linearGradient>
                        </defs>
                        <!-- Bubble Body -->
                        <path
                            d="M10,40 C10,20 28,5 50,5 C72,5 90,20 90,40 C90,60 72,75 50,75 C42,75 35,73 28,68 C20,76 10,78 10,78 C12,70 15,62 13,55 C11,50 10,45 10,40 Z"
                            fill="url(#bubbleGrad)" />
                        <!-- Three Dots -->
                        <circle cx="32" cy="38" r="5" fill="#1a1a1a" />
                        <circle cx="50" cy="38" r="5" fill="#1a1a1a" />
                        <circle cx="68" cy="38" r="5" fill="#1a1a1a" />
                        <!-- Green Swoosh Underneath -->
                        <path d="M 20,78 Q 45,95 85,60" fill="none" stroke="#34c759" stroke-width="4"
                            stroke-linecap="round" />
                    </svg>
                    <span class="signal-text">SIGNAL</span>
                </div>

                <!-- RGY Column -->
                <div class="flex flex-col items-center mr-[4.5rem]">
                    <div class="rgy-container">
                        <div class="rgy-light rgy-red"></div>
                        <div class="rgy-light rgy-yellow"></div>
                        <div class="rgy-light rgy-green"></div>
                    </div>

                    <div
                        class="mt-4 flex flex-col items-center opacity-50 hover:opacity-100 cursor-pointer transition-opacity">
                        <svg class="w-4 h-4 text-gray-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z">
                            </path>
                        </svg>
                        <span class="text-[10px] text-gray-400 font-semibold tracking-wider">Keywords</span>
                    </div>
                </div>

            </div>
        </div>

        <!-- BOTTOM SECTION -->
        <div class="flex justify-between items-end pb-8">

            <!-- Bottom Left Menu -->
            <div class="px-10 w-[280px] pointer-events-auto">
                <div
                    class="mb-4 inline-flex items-center justify-center border border-gray-700/60 p-2.5 rounded hover:border-orange-500 transition-colors cursor-pointer bg-black/20">
                    <svg class="w-8 h-8 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                    </svg>
                </div>
                <nav class="space-y-4 text-[13px] font-medium text-gray-400 ml-1">
                    <a href="#" class="flex items-center gap-3 hover:text-white transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                            </path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        Settings
                    </a>
                    <a href="#" class="flex items-center gap-3 hover:text-white transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        Log In
                    </a>
                </nav>
            </div>

            <!-- Footer Small Txt -->
            <div class="flex-1 pb-2 flex justify-center pointer-events-auto">
                <p class="text-[11px] text-[#6b7280] font-normal tracking-wide">
                    All conversations are confidential. CubiQo never retains user voice by policy. &middot;
                    <span class="text-gray-400 hover:text-orange-400 cursor-pointer transition-colors">Try BYO
                        Mode</span> &middot;
                    Your data &middot; Your storage &middot; Your API key &middot; &copy; 2026 Cubiqo United Inc.
                </p>
            </div>

            <!-- Support Button -->
            <div class="px-10 w-[280px] flex justify-end pointer-events-auto relative">
                <div class="relative">
                    <button class="support-btn">
                        Support
                    </button>
                    <!-- Speech Tail -->
                    <div class="support-tail"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- CANVAS ANIMATION ENGINE -->
    <script>
        const canvas = document.getElementById('hero-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let time = 0;

        // Setup floating fire particles
        const particles = [];
        for (let i = 0; i < 60; i++) {
            particles.push({
                x: (Math.random() - 0.5) * 400,
                y: (Math.random() - 0.5) * 200,
                baseSize: Math.random() * 2.5 + 0.5,
                phase: Math.random() * Math.PI * 2,
                speed: Math.random() * 0.02 + 0.01
            });
        }

        function draw() {
            // Dark background cleanup
            ctx.fillStyle = '#08080a';
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.translate(width / 2, height / 2);

            // ==========================================
            // 1. DRAW SILVER SINE WAVES (Matching Prod Structure)
            // ==========================================
            const lines = 45;
            for (let i = 0; i < lines; i++) {
                ctx.beginPath();
                // Evenly stack the waves vertically like the production screenshot
                const spreadY = (i - lines / 2) * 15;

                for (let x = -width / 2; x <= width / 2; x += 15) {
                    // Smooth, continuous overlapping waves (no artificial pinch in the center)
                    const wave1 = Math.sin(x * 0.003 + time * 1.2 + i * 0.05) * 110;
                    const wave2 = Math.cos(x * 0.005 - time * 0.8 + i * 0.03) * 60;

                    const finalY = spreadY + wave1 + wave2;

                    if (x === -width / 2) ctx.moveTo(x, finalY);
                    else ctx.lineTo(x, finalY);
                }

                // Color the threads in pure Silver
                const distance_from_center = Math.abs(i - lines / 2) / (lines / 2);
                const opacity = 0.2 + (1 - distance_from_center) * 0.4;
                ctx.strokeStyle = `rgba(215, 225, 240, ${opacity})`;
                ctx.lineWidth = 1.0;
                ctx.stroke();
            }

            // ==========================================
            // 2. DRAW CENTRAL SOUL CORE (Amber/Brown Match)
            // ==========================================
            ctx.globalCompositeOperation = "screen";

            // Core blob radius
            const radius = 35 + Math.sin(time * 3) * 5;

            // Gradient matching the specific dusty orange/brown of the prod core
            const blobGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, radius * 2.5);
            blobGrad.addColorStop(0, "rgba(255, 180, 120, 0.9)"); // Bright core
            blobGrad.addColorStop(0.3, "rgba(160, 60, 40, 0.8)"); // Muddy orange/brown
            blobGrad.addColorStop(1, "rgba(160, 60, 40, 0)"); // Fade

            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = blobGrad;
            ctx.fill();

            // Large ambient ambient glow 
            ctx.beginPath();
            ctx.arc(0, 0, 160, 0, Math.PI * 2);
            const ambientGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 160);
            ambientGrad.addColorStop(0, "rgba(255, 100, 50, 0.1)");
            ambientGrad.addColorStop(1, "transparent");
            ctx.fillStyle = ambientGrad;
            ctx.fill();

            // ==========================================
            // 3. DRAW FLOATING SQUARE PARTICLES
            // ==========================================
            particles.forEach(p => {
                p.phase += p.speed;
                // Particles drift
                const px = p.x + Math.sin(p.phase * 2) * 40;
                const py = p.y + Math.cos(p.phase * 1.5) * 20;

                const currentSize = p.baseSize + Math.sin(p.phase * 5) * 1.5;

                // Background glow behind the particle
                ctx.beginPath();
                ctx.arc(px, py, currentSize * 4, 0, Math.PI * 2);
                const pGlow = ctx.createRadialGradient(px, py, 0, px, py, currentSize * 4);
                pGlow.addColorStop(0, `rgba(255, 140, 50, ${0.3 + Math.sin(p.phase) * 0.1})`);
                pGlow.addColorStop(1, "transparent");
                ctx.fillStyle = pGlow;
                ctx.fill();

                // Draw the actual sharp square particle matching prod screenshot
                ctx.fillStyle = `rgba(255, ${180 + Math.sin(p.phase) * 50}, 120, ${0.8 + Math.sin(p.phase * 3) * 0.2})`;
                ctx.fillRect(px - currentSize, py - currentSize, currentSize * 2, currentSize * 2);
            });

            ctx.restore();
            time += 0.008;
            requestAnimationFrame(draw);
        }

        // Start animation loop
        draw();
    </script>
</body>

</html>
