<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Cubiqo - A conscious cube between light and code">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cubiqo - Emotional AI Companion</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Performance: Preconnect to CDN (saves ~200-500ms on DNS/TLS) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

    <!-- Dev Mode Detection (runs before CSS/DOM rendering) -->
    <script>
        // Check if we're on production (before any rendering happens)
        const urlParams = new URLSearchParams(window.location.search);
        const forceProduction = urlParams.get('production') === 'true';
        const isProduction = window.location.hostname === 'cubiqo.ai' || forceProduction;

        // Add dev-mode class to <html> if NOT production
        if (!isProduction) {
            document.documentElement.classList.add('dev-mode');
        }
    </script>

    <!-- Styles -->
    <link rel="stylesheet" href="./styles/main.css?v=10">

    <!-- Three.js Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Initializing consciousness...</div>
        <div class="loading-text" style="margin-top: 10px; font-size: 12px; opacity: 0.5;">v2.1.1</div>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- FPS Monitor -->
    <div id="fps-monitor">
        <div class="fps-current">FPS: --</div>
        <div class="fps-avg">Avg: --</div>
    </div>

    <!-- Voice Control UI -->
    <div id="voice-ui">
        <button id="voice-btn" aria-label="Voice input">🎤</button>
    </div>

    <!-- Manual Mode Toggle -->
    <div id="manual-mode-toggle">
        <button id="toggle-manual-mode" aria-label="Toggle Manual Mode">
            <span class="toggle-icon">🎨</span>
            <span class="toggle-text">Manual Mode</span>
        </button>
    </div>

    <!-- Color Controls -->
    <div id="controls" class="manual-mode-hidden">
        <button class="color-btn red" data-color="RED" aria-label="Red - Desire"></button>
        <button class="color-btn yellow" data-color="YELLOW" aria-label="Yellow - Comfort"></button>
        <button class="color-btn greenBlue" data-color="GREEN_BLUE" aria-label="Green-Blue - Growth"></button>
        <button class="color-btn orange active" data-color="ORANGE" aria-label="Orange - Stillness"></button>
    </div>

    <!-- Transcript Display -->
    <div id="transcript"></div>

    <!-- Main Application -->
    <script type="module" src="./src/main.js?v=10"></script>
</body>
</html>
