<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CUBIQO — Neon Glass Cube</title>
<style>
  html, body { margin: 0; height: 100%; background: #050814; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #ui {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    background: rgba(5,8,20,.75); padding: 14px 18px; border-radius: 10px;
    border: 1px solid rgba(139,185,254,.3); color: #8bb9fe; max-width: 280px;
  }
  #ui h1 { margin: 0 0 6px; font-size: 1.1rem; font-weight: 400; color: #fff; letter-spacing: .08em; }
  #ui p  { margin: 0 0 8px; font-size: .78rem; line-height: 1.5; }
  #ui a  { font-size: .72rem; color: #8bb9fe; text-decoration: none; opacity: .7; }
  #ui a:hover { opacity: 1; }
  #status { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 5px;
    font-size: .75rem; font-weight: 600; }
  .loading { background: rgba(255,193,7,.18); color: #ffc107; }
  .ok      { background: rgba(76,175,80,.18); color: #4caf50; }
  .err     { background: rgba(244,67,54,.18); color: #f44336; }
</style>
</head>
<body>
<div id="ui">
  <h1>🟦 Neon Glass Cube</h1>
  <p>Drag to rotate · Scroll to zoom</p>
  <a href="index.html">← Back to hub</a>
  <div id="status" class="loading">Loading…</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const status = document.getElementById('status');

try {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);
  renderer.domElement.style.cssText = 'position:fixed;top:0;left:0;';

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x050814, 3, 14);

  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(3.2, 2.0, 4.2);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.AmbientLight(0x2233ff, 0.5));
  const key = new THREE.DirectionalLight(0xffffff, 1.0);
  key.position.set(4, 6, 3);
  scene.add(key);

  const vert = `
    varying vec3 vPos;
    varying vec3 vNrm;
    void main() {
      vPos = (modelMatrix * vec4(position, 1.0)).xyz;
      vNrm = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * vec4(vPos, 1.0);
    }`;

  const frag = `
    uniform float uTime;
    varying vec3 vPos;
    varying vec3 vNrm;
    float hash(vec3 p) {
      p = fract(p * 0.3183099 + vec3(0.1,0.2,0.3)); p *= 17.0;
      return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
    }
    float noise(vec3 p) {
      vec3 i = floor(p), f = fract(p);
      f = f*f*(3.0-2.0*f);
      return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                 mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
    }
    float fbm(vec3 p) {
      float v=0.0, a=0.55;
      for(int i=0;i<5;i++){v+=a*noise(p);p*=2.02;a*=0.5;}
      return v;
    }
    vec3 palette(float t) {
      vec3 a=vec3(.15,.30,.95),b=vec3(.15,.95,.85),c=vec3(.95,.25,.75);
      return mix(mix(a,b,smoothstep(.2,.6,t)),c,smoothstep(.55,.95,t));
    }
    void main() {
      vec3 p = vPos*1.1;
      float n = fbm(p+vec3(0,0,uTime*.22));
      float blobs = smoothstep(.55,.78,n);
      vec3 base = vec3(.08,.14,.35);
      vec3 col  = palette(n);
      float rim = pow(1.0-max(0.0,dot(normalize(vNrm),normalize(cameraPosition-vPos))),2.0);
      vec3 em   = col*(0.9*blobs+0.35*rim);
      float haze= smoothstep(0.0,1.0,fbm(p*.65+uTime*.08))*.18;
      gl_FragColor = vec4(base+em+haze, .72);
    }`;

  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: vert, fragmentShader: frag,
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
  });

  const cube = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.6, 2.2), mat);
  scene.add(cube);

  const ped = new THREE.Mesh(
    new THREE.CylinderGeometry(1.3, 1.5, 0.25, 64),
    new THREE.MeshStandardMaterial({ color: 0x061032, metalness: 0.4, roughness: 0.3 })
  );
  ped.position.y = -1.05;
  scene.add(ped);

  status.textContent = '✓ Running';
  status.className = 'ok';

  const clock = new THREE.Clock();
  (function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    mat.uniforms.uTime.value = t;
    cube.rotation.y = t * 0.25;
    cube.rotation.x = Math.sin(t * 0.15) * 0.05;
    controls.update();
    renderer.render(scene, camera);
  })();

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

} catch (e) {
  status.textContent = '✗ ' + e.message;
  status.className = 'err';
  console.error(e);
}
</script>
</body>
</html>
