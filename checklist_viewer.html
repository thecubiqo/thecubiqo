<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merged Requirements Checklist</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <style>
        body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
            background-color: #0d1117;
            /* Dark mode background */
        }

        .markdown-body {
            background-color: transparent;
        }
    </style>
</head>

<body class="markdown-body" data-color-mode="dark" data-dark-theme="dark">
    <div id="content">Loading checklist...</div>
    <script>
        fetch('MERGED_REQUIREMENTS_CHECKLIST.md')
            .then(response => response.text())
            .then(text => {
                document.getElementById('content').innerHTML = marked.parse(text);
            })
            .catch(error => {
                document.getElementById('content').innerHTML = "Error loading markdown. Make sure the local web server is running.";
                console.error('Error fetching markdown:', error);
            });
    </script>
</body>

</html>
