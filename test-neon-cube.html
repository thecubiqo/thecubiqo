<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Neon Glass Cube Test</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #050814;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  
  .container {
    position: relative;
    width: 100%;
    height: 100%;
  }
  
  .info {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #8bb9fe;
    z-index: 100;
    background: rgba(5, 8, 20, 0.7);
    padding: 15px;
    border-radius: 10px;
    border: 1px solid rgba(139, 185, 254, 0.3);
    max-width: 400px;
  }
  
  h1 {
    margin: 0 0 10px 0;
    color: #ffffff;
    font-size: 24px;
  }
  
  p {
    margin: 0 0 10px 0;
    line-height: 1.5;
    font-size: 14px;
  }
  
  .status {
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: bold;
    margin-top: 10px;
    display: inline-block;
  }
  
  .loading {
    background: rgba(255, 193, 7, 0.2);
    color: #ffc107;
  }
  
  .success {
    background: rgba(76, 175, 80, 0.2);
    color: #4caf50;
  }
  
  .error {
    background: rgba(244, 67, 54, 0.2);
    color: #f44336;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="info">
      <h1>🧊 Neon Glass Cube Test</h1>
      <p>Testing the WebGL neon cube visualization. This is a demo of what could be integrated into Cubiqo's UI.</p>
      <p>Drag to rotate • Scroll to zoom</p>
      <div id="status" class="status loading">Loading Three.js...</div>
    </div>
    <div id="canvas-container"></div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";
    
    const status = document.getElementById('status');
    
    try {
      status.textContent = 'Creating renderer...';
      status.className = 'status loading';
      
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.getElementById('canvas-container').appendChild(renderer.domElement);
      
      status.textContent = 'Setting up scene...';
      
      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x050814, 3, 14);
      
      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(3.2, 2.0, 4.2);
      
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      
      // Lighting
      scene.add(new THREE.AmbientLight(0x2233ff, 0.5));
      const key = new THREE.DirectionalLight(0xffffff, 1.0);
      key.position.set(4, 6, 3);
      scene.add(key);
      
      // Cube geometry
      const geo = new THREE.BoxGeometry(2.6, 1.6, 2.2, 1, 1, 1);
      
      // Shader material
      const frag = `
        uniform float uTime;
        varying vec3 vPos;
        varying vec3 vNrm;
        
        float hash(vec3 p) {
          p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3));
          p *= 17.0;
          return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
        }
        
        float noise(vec3 p) {
          vec3 i = floor(p);
          vec3 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          
          float n000 = hash(i + vec3(0, 0, 0));
          float n100 = hash(i + vec3(1, 0, 0));
          float n010 = hash(i + vec3(0, 1, 0));
          float n110 = hash(i + vec3(1, 1, 0));
          float n001 = hash(i + vec3(0, 0, 1));
          float n101 = hash(i + vec3(1, 0, 1));
          float n011 = hash(i + vec3(0, 1, 1));
          float n111 = hash(i + vec3(1, 1, 1));
          
          float n00 = mix(n000, n100, f.x);
          float n10 = mix(n010, n110, f.x);
          float n01 = mix(n001, n101, f.x);
          float n11 = mix(n011, n111, f.x);
          
          float n0 = mix(n00, n10, f.y);
          float n1 = mix(n01, n11, f.y);
          
          return mix(n0, n1, f.z);
        }
        
        float fbm(vec3 p) {
          float v = 0.0;
          float a = 0.55;
          for (int i = 0; i < 5; i++) {
            v += a * noise(p);
            p *= 2.02;
            a *= 0.5;
          }
          return v;
        }
        
        vec3 palette(float t) {
          vec3 a = vec3(0.15, 0.30, 0.95);
          vec3 b = vec3(0.15, 0.95, 0.85);
          vec3 c = vec3(0.95, 0.25, 0.75);
          return mix(mix(a, b, smoothstep(0.2, 0.6, t)), c, smoothstep(0.55, 0.95, t));
        }
        
        void main() {
          vec3 p = vPos * 1.1;
          
          // Animate blobs
          float n = fbm(p + vec3(0.0, 0.0, uTime * 0.22));
          float blobs = smoothstep(0.55, 0.78, n);
          
          // Glass base
          vec3 base = vec3(0.08, 0.14, 0.35);
          
          // Emissive blobs
          vec3 col = palette(n);
          float rim = pow(1.0 - max(0.0, dot(normalize(vNrm), normalize(cameraPosition - vPos))), 2.0);
          vec3 emissive = col * (0.9 * blobs + 0.35 * rim);
          
          // Fake internal scattering
          float haze = smoothstep(0.0, 1.0, fbm(p * 0.65 + uTime * 0.08)) * 0.18;
          
          vec3 outCol = base + emissive + haze;
          gl_FragColor = vec4(outCol, 0.72);
        }
      `;
      
      const vert = `
        varying vec3 vPos;
        varying vec3 vNrm;
        
        void main() {
          vPos = (modelMatrix * vec4(position, 1.0)).xyz;
          vNrm = normalize(mat3(modelMatrix) * normal);
          gl_Position = projectionMatrix * viewMatrix * vec4(vPos, 1.0);
        }
      `;
      
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 }
        },
        vertexShader: vert,
        fragmentShader: frag,
        transparent: true,
        depthWrite: false
      });
      
      const cube = new THREE.Mesh(geo, mat);
      scene.add(cube);
      
      // Pedestal
      const ped = new THREE.Mesh(
        new THREE.CylinderGeometry(1.3, 1.5, 0.25, 64),
        new THREE.MeshStandardMaterial({
          color: 0x061032,
          metalness: 0.4,
          roughness: 0.3
        })
      );
      ped.position.y = -1.05;
      scene.add(ped);
      
      status.textContent = 'Ready! Rendering cube...';
      status.className = 'status success';
      
      // Animation
      const clock = new THREE.Clock();
      
      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        
        mat.uniforms.uTime.value = t;
        cube.rotation.y = t * 0.25;
        cube.rotation.x = Math.sin(t * 0.15) * 0.05;
        
        controls.update();
        renderer.render(scene, camera);
      }
      
      // Handle resize
      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
      
      window.addEventListener('resize', onResize);
      animate();
      
    } catch (error) {
      status.textContent = 'Error: ' + error.message;
      status.className = 'status error';
      console.error('Cube error:', error);
    }
  </script>
</body>
</html>
