<!DOCTYPE html>
<html>
<head>
    <title>Test CubiQo APIs</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        button { padding: 10px; margin: 5px; }
        .result { margin-top: 10px; padding: 10px; background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>Test CubiQo APIs</h1>
    
    <div class="test">
        <h3>1. Health Check</h3>
        <button onclick="testHealth()">Test /api/health</button>
        <div id="healthResult" class="result"></div>
    </div>
    
    <div class="test">
        <h3>2. Chat API</h3>
        <input type="text" id="chatMessage" value="Hello CubiQo!" style="width: 300px; padding: 8px;">
        <button onclick="testChat()">Test /api/chat</button>
        <div id="chatResult" class="result"></div>
    </div>
    
    <div class="test">
        <h3>3. TTS API</h3>
        <input type="text" id="ttsText" value="Hello from CubiQo TTS" style="width: 300px; padding: 8px;">
        <button onclick="testTTS()">Test /api/tts</button>
        <div id="ttsResult" class="result"></div>
    </div>
    
    <script>
        async function testHealth() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                document.getElementById('healthResult').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('healthResult').textContent = 'Error: ' + error.message;
            }
        }
        
        async function testChat() {
            const message = document.getElementById('chatMessage').value;
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, sessionId: 'test-' + Date.now() })
                });
                const data = await response.json();
                document.getElementById('chatResult').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('chatResult').textContent = 'Error: ' + error.message;
            }
        }
        
        async function testTTS() {
            const text = document.getElementById('ttsText').value;
            try {
                const response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, sessionId: 'test-' + Date.now() })
                });
                const data = await response.json();
                document.getElementById('ttsResult').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('ttsResult').textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
