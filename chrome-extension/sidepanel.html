<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>CubiQo Sidekick</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            color: white;
            font-family: sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #status-bar {
            height: 30px;
            background: #111;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            font-size: 12px;
            color: #888;
        }

        #current-url {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        #connection-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            margin-left: 8px;
        }
    </style>
</head>

<body>
    <div id="status-bar">
        <span>👁️ Watching: <span id="current-url">...</span></span>
        <span id="connection-status" title="Connected"></span>
    </div>
    <!-- App URL: localhost for development. Set CUBIQO_APP_URL env var or update to
         https://www.cubiqo.ai for production builds. See chrome-extension/README.md -->
    <iframe src="http://localhost:3000/side-panel?mode=extension" id="app-frame" allow="microphone; camera"></iframe>
    <script src="sidepanel.js"></script>
</body>

</html>
