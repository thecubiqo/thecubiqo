<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CubiQo Attribution</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 240px;
        padding: 16px;
        margin: 0;
      }

      p {
        font-size: 12px;
        color: #666;
        margin: 0;
        line-height: 1.4;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 12px;
        font-size: 13px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
      }
    </style>
  </head>
  <body>
    <div class="status"><div class="dot"></div><strong>CubiQo Attribution Active</strong></div>
    <p>
      When you shop from a CubiQo recommendation, this extension helps apply attribution so CubiQo may earn a small
      commission at no extra cost to you.
    </p>
  </body>
</html>
